[workspace]
members = ["pe-protocol", "pe-save", "pe-session", "pe-tools"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
publish = false

[workspace.dependencies]
pe-protocol = { path = "pe-protocol" }
pe-session = { path = "pe-session" }
pe-save = { path = "pe-save" }
crc32fast = "=1.5.4"
serde_json = "=1.0.154"
png = "=0.18.1"
